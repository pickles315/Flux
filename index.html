<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101116"><title>Flux — Video Editor</title>
<style>
:root{color-scheme:dark;--bg:#101116;--panel:#181a22;--panel2:#20232d;--line:#303440;--muted:#9299aa;--text:#f2f3f7;--accent:#8b7cff;--accent2:#b0a5ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 Inter,ui-sans-serif,system-ui,Segoe UI,sans-serif;overflow:hidden}
button,input,select{font:inherit}button{background:#292c38;border:1px solid #3a3e4b;color:var(--text);border-radius:7px;padding:8px 11px;cursor:pointer}button:hover{background:#353949}button.primary{background:var(--accent);border-color:var(--accent);color:white;font-weight:650}button:disabled{opacity:.4;cursor:not-allowed}
.top{height:54px;display:flex;align-items:center;gap:14px;padding:0 16px;border-bottom:1px solid var(--line);background:#15161d}.logo{font-weight:850;font-size:18px;letter-spacing:.5px}.logo span{color:var(--accent2)}.project-name{background:transparent;border:0;color:white;font-weight:650;width:190px}.spacer{flex:1}.status{color:var(--muted);font-size:12px}
.workspace{height:calc(100vh - 54px);display:grid;grid-template-columns:265px minmax(350px,1fr) 250px;grid-template-rows:minmax(280px,1fr) 310px;gap:1px;background:var(--line)}
.panel{background:var(--panel);min-width:0;min-height:0}.panel-head{height:42px;padding:0 13px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);font-weight:700}.panel-head small{font-weight:400;color:var(--muted)}
.media-panel{grid-row:1/3;display:flex;flex-direction:column}.media-actions{padding:10px;display:flex;gap:7px}.media-grid{padding:8px;display:grid;grid-template-columns:1fr 1fr;gap:8px;overflow:auto}.asset{background:var(--panel2);border:1px solid var(--line);border-radius:8px;overflow:hidden;cursor:pointer;min-width:0}.asset:hover,.asset.selected{border-color:var(--accent)}.thumb{height:82px;background:#11131a;display:grid;place-items:center;color:#747b8d;font-size:25px;overflow:hidden}.thumb img,.thumb video{width:100%;height:100%;object-fit:cover}.asset-name{padding:7px 8px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.asset-meta{padding:0 8px 7px;color:var(--muted);font-size:10px}
.preview-panel{display:flex;flex-direction:column}.preview-stage{flex:1;min-height:0;display:grid;place-items:center;background:#090a0e;padding:12px;position:relative}.preview-frame{position:relative;width:min(100%,900px);height:100%;max-height:100%;aspect-ratio:16/9;background:#000;overflow:hidden;display:grid;place-items:center}.preview-frame video,.preview-frame img{position:absolute;width:100%;height:100%;object-fit:contain}.preview-frame canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.empty-preview{color:#6e7483;text-align:center}.transport{height:56px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:12px}.timecode{font-variant-numeric:tabular-nums;color:#c9cbd4;min-width:110px;text-align:center}.timeline-panel{grid-column:2/4;display:flex;flex-direction:column}.timeline-toolbar{height:48px;display:flex;align-items:center;gap:7px;padding:0 12px;border-bottom:1px solid var(--line)}.timeline-scroll{overflow:auto;flex:1;position:relative;background:#13151c}.ruler{height:28px;position:sticky;top:0;background:#1b1e27;border-bottom:1px solid var(--line);z-index:3;min-width:900px}.ruler-mark{position:absolute;top:0;height:100%;border-left:1px solid #444957;padding:5px 0 0 4px;color:#9da3b2;font-size:10px}.track{height:76px;border-bottom:1px solid #2c303b;position:relative;min-width:900px}.track-label{position:sticky;left:0;z-index:2;float:left;width:90px;height:100%;padding:9px;background:#1a1d26;border-right:1px solid var(--line);color:#b6bbca;font-size:11px}.track-lane{position:absolute;left:90px;right:0;top:0;height:100%}.clip{position:absolute;top:8px;height:59px;border:1px solid #7770d7;background:#49427d;border-radius:5px;overflow:hidden;min-width:24px;cursor:pointer}.clip.audio{background:#285c61;border-color:#4d9ba0}.clip.selected{outline:2px solid #d0caff;outline-offset:1px}.clip-name{padding:5px 7px;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.clip-wave{height:20px;opacity:.4;background:repeating-linear-gradient(90deg,transparent 0 3px,#b5f4e8 4px 5px,transparent 6px 9px)}.playhead{position:absolute;top:0;bottom:0;width:2px;background:#ff697e;z-index:4;pointer-events:none}.playhead:before{content:"";position:absolute;top:0;left:-5px;border-left:6px solid transparent;border-right:6px solid transparent;border-top:8px solid #ff697e}.inspector{display:flex;flex-direction:column;overflow:auto}.inspector-body{padding:13px;display:grid;gap:12px}.field{display:grid;gap:5px;color:#b9becc;font-size:12px}.field input,.field select{width:100%;background:#101219;border:1px solid #383d4b;border-radius:6px;color:white;padding:8px}.field-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.hint{color:var(--muted);font-size:11px}.empty-inspector{color:var(--muted);padding:15px;font-size:12px}
@media(max-width:900px){body{overflow:auto}.workspace{height:auto;min-height:calc(100vh - 54px);grid-template-columns:220px 1fr;grid-template-rows:450px 280px 300px}.media-panel{grid-row:1/4}.inspector{grid-column:2;grid-row:3}.timeline-panel{grid-column:1/3;grid-row:2}.preview-panel{grid-column:2;grid-row:1}}
</style>
</head>
<body>
<header class="top"><div class="logo">FLU<span>X</span></div><input id="projectName" class="project-name" value="Untitled Project" aria-label="Project name"><span class="status" id="saveStatus">Saved locally</span><div class="spacer"></div><button id="newProject">New</button><button id="saveProject" class="primary">Save project</button><button id="exportBtn">Export WebM</button></header>
<main class="workspace">
<section class="panel media-panel"><div class="panel-head">Media <small id="assetCount">0 items</small></div><div class="media-actions"><button class="primary" id="importBtn">＋ Import media</button><button id="newText">＋ Text</button><input id="fileInput" type="file" accept="video/*,audio/*,image/*" multiple hidden></div><div class="media-grid" id="mediaGrid"></div><div class="empty-inspector" id="mediaHint">Import videos, audio, or images. Your files stay in this browser.</div></section>
<section class="panel preview-panel"><div class="panel-head">Program Monitor <small>16:9 preview</small></div><div class="preview-stage"><div class="preview-frame" id="previewFrame"><div class="empty-preview">Import media, then add it to the timeline.</div></div></div><div class="transport"><button id="toStart" title="Go to start">|◀</button><button id="playBtn" class="primary">▶ Play</button><button id="stepBtn" title="Step forward">▶|</button><div class="timecode" id="timecode">00:00.000</div></div></section>
<aside class="panel inspector"><div class="panel-head">Properties</div><div id="inspectorBody" class="inspector-body"><div class="empty-inspector">Select a clip on the timeline to edit its settings.</div></div></aside>
<section class="panel timeline-panel"><div class="panel-head">Timeline <small>Click an asset, then Add to timeline</small></div><div class="timeline-toolbar"><button id="addClip">＋ Add selected</button><button id="splitClip">Split</button><button id="deleteClip">Delete</button><button id="zoomOut">−</button><button id="zoomIn">＋</button><span class="spacer"></span><span class="hint" id="durationLabel">00:00</span></div><div class="timeline-scroll" id="timelineScroll"><div class="ruler" id="ruler"></div><div id="tracks"></div><div class="playhead" id="playhead"></div></div></section>
</main>
<script>
(()=>{
const DB='flux-editor-db',STORE='records';let db,assets=[],clips=[],selectedAsset=null,selectedClip=null,playhead=0,scale=80,playing=false,lastTick=0,raf=0,projectName='Untitled Project',previewObjectUrl=null;
const $=id=>document.getElementById(id),uid=()=>Math.random().toString(36).slice(2,10),fmt=t=>{t=Math.max(0,t||0);let m=Math.floor(t/60),s=Math.floor(t%60),ms=Math.floor((t%1)*1000);return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')+'.'+String(ms).padStart(3,'0')},duration=()=>Math.max(10,...clips.map(c=>c.start+c.duration+2));
function openDB(){return new Promise((res,rej)=>{let q=indexedDB.open(DB,1);q.onupgradeneeded=()=>q.result.createObjectStore(STORE,{keyPath:'id'});q.onsuccess=()=>{db=q.result;res()};q.onerror=()=>rej(q.error)})}
function put(v){return new Promise((res,rej)=>{let t=db.transaction(STORE,'readwrite');t.objectStore(STORE).put(v);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
function all(){return new Promise((res,rej)=>{let q=db.transaction(STORE).objectStore(STORE).getAll();q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
function del(id){return new Promise((res,rej)=>{let t=db.transaction(STORE,'readwrite');t.objectStore(STORE).delete(id);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
function setStatus(s){$('saveStatus').textContent=s}
function assetBy(id){return assets.find(a=>a.id===id)}
function clipAt(t){return clips.filter(c=>t>=c.start&&t<c.start+c.duration).sort((a,b)=>b.track-a.track)[0]}
function renderAssets(){let g=$('mediaGrid');g.innerHTML='';$('assetCount').textContent=assets.length+' items';$('mediaHint').style.display=assets.length?'none':'block';assets.forEach(a=>{let el=document.createElement('div');el.className='asset'+(a.id===selectedAsset?' selected':'');let thumb=document.createElement('div');thumb.className='thumb';if(a.type.startsWith('image/')){let im=document.createElement('img');im.src=URL.createObjectURL(a.blob);thumb.append(im)}else thumb.textContent=a.type.startsWith('video/')?'▶':a.type.startsWith('audio/')?'♫':'▧';let n=document.createElement('div');n.className='asset-name';n.textContent=a.name;let m=document.createElement('div');m.className='asset-meta';m.textContent=a.type.split('/')[0];el.append(thumb,n,m);el.onclick=()=>{selectedAsset=a.id;renderAssets()};g.append(el)})}
async function importFiles(files){for(const f of files){let a={id:uid(),name:f.name,type:f.type||'application/octet-stream',size:f.size,blob:f,duration:0};if(f.type.startsWith('video/')||f.type.startsWith('audio/'))a.duration=await getDuration(f);assets.push(a);await put({kind:'asset',...a})}renderAssets();setStatus('Imported '+files.length+' file(s)')}
function getDuration(file){return new Promise(resolve=>{let el=document.createElement(file.type.startsWith('video/')?'video':'audio'),u=URL.createObjectURL(file);el.preload='metadata';el.onloadedmetadata=()=>{let d=el.duration;URL.revokeObjectURL(u);resolve(Number.isFinite(d)?d:5)};el.onerror=()=>{URL.revokeObjectURL(u);resolve(5)};el.src=u})}
function addAsset(a){let d=a.duration||5;let c={id:uid(),assetId:a.id,name:a.name,start:playhead,duration:d,sourceStart:0,track:a.type.startsWith('audio/')?1:0,type:a.type};clips.push(c);selectedClip=c.id;renderTimeline();renderInspector();renderPreview()}
function renderTimeline(){let tracks=$('tracks');tracks.innerHTML='';for(let t=0;t<2;t++){let row=document.createElement('div');row.className='track';let label=document.createElement('div');label.className='track-label';label.textContent=t===0?'V1 · Video':'A1 · Audio';let lane=document.createElement('div');lane.className='track-lane';clips.filter(c=>c.track===t).forEach(c=>{let e=document.createElement('div');e.className='clip'+(t===1?' audio':'')+(c.id===selectedClip?' selected':'');e.style.left=(c.start*scale)+'px';e.style.width=Math.max(24,c.duration*scale)+'px';let n=document.createElement('div');n.className='clip-name';n.textContent=c.name;e.append(n);if(t===1){let w=document.createElement('div');w.className='clip-wave';e.append(w)}e.onclick=()=>{selectedClip=c.id;renderTimeline();renderInspector();playhead=c.start;updatePlayhead();renderPreview()};lane.append(e)});row.append(label,lane);tracks.append(row)}tracks.style.width=(90+duration()*scale)+'px';$('ruler').style.width=(90+duration()*scale)+'px';$('ruler').innerHTML='';for(let i=0;i<=duration();i+=Math.max(1,Math.round(5/scale))){let mark=document.createElement('div');mark.className='ruler-mark';mark.style.left=(90+i*scale)+'px';mark.textContent=fmt(i).slice(0,5);$('ruler').append(mark)}updatePlayhead();$('durationLabel').textContent=fmt(duration())}
function updatePlayhead(){$('playhead').style.left=(90+playhead*scale)+'px';$('timecode').textContent=fmt(playhead)}
function renderInspector(){let c=clips.find(x=>x.id===selectedClip),b=$('inspectorBody');b.innerHTML='';if(!c){b.innerHTML='<div class="empty-inspector">Select a clip on the timeline to edit its settings.</div>';return}const field=(label,id,value,step='0.1')=>{let w=document.createElement('label');w.className='field';w.textContent=label;let i=document.createElement('input');i.type='number';i.step=step;i.min='0';i.value=value;i.id=id;w.append(i);b.append(w);i.onchange=()=>{let v=Number(i.value);if(!Number.isFinite(v))return;if(id==='clipStart')c.start=v;if(id==='clipDuration')c.duration=Math.max(.1,v);if(id==='clipSource')c.sourceStart=v;renderTimeline();renderPreview()}};let h=document.createElement('div');h.textContent=c.name;h.style.fontWeight='700';b.append(h);field('Timeline position (seconds)','clipStart',c.start);field('Clip duration (seconds)','clipDuration',c.duration);field('Source in (seconds)','clipSource',c.sourceStart);let tr=document.createElement('label');tr.className='field';tr.textContent='Track';let s=document.createElement('select');s.innerHTML='<option value="0">Video 1</option><option value="1">Audio 1</option>';s.value=c.track;s.onchange=()=>{c.track=Number(s.value);renderTimeline()};tr.append(s);b.append(tr);let note=document.createElement('div');note.className='hint';note.textContent='Trim by changing duration and source in. Drag clips in a future update.';b.append(note)}
function renderPreview(){let frame=$('previewFrame'),c=clipAt(playhead);frame.innerHTML='';if(!c){let e=document.createElement('div');e.className='empty-preview';e.textContent='Nothing at the playhead';frame.append(e);return}let a=assetBy(c.assetId);if(!a)return;if(previewObjectUrl)URL.revokeObjectURL(previewObjectUrl);previewObjectUrl=URL.createObjectURL(a.blob);if(a.type.startsWith('video/')){let v=document.createElement('video');v.src=previewObjectUrl;v.muted=true;v.playsInline=true;v.controls=false;v.onloadedmetadata=()=>{try{v.currentTime=Math.min(c.sourceStart+playhead-c.start,v.duration||0)}catch{}};frame.append(v);if(playing)v.play().catch(()=>{})}else if(a.type.startsWith('image/')){let im=document.createElement('img');im.src=previewObjectUrl;frame.append(im)}else{let e=document.createElement('div');e.className='empty-preview';e.textContent='Audio clip · '+a.name;frame.append(e)}}
function tick(now){if(!playing)return;if(!lastTick)lastTick=now;playhead+=(now-lastTick)/1000;lastTick=now;if(playhead>=duration()){playhead=0;pause()}updatePlayhead();let c=clipAt(playhead);if(c){let a=assetBy(c.assetId),v=$('previewFrame').querySelector('video');if(v&&a&&a.type.startsWith('video/')){let target=c.sourceStart+playhead-c.start;if(Math.abs(v.currentTime-target)>.25)try{v.currentTime=target}catch{};if(v.paused)v.play().catch(()=>{})}else if(!v)renderPreview()}else renderPreview();raf=requestAnimationFrame(tick)}
function pause(){playing=false;cancelAnimationFrame(raf);lastTick=0;$('playBtn').textContent='▶ Play';let v=$('previewFrame').querySelector('video');if(v)v.pause()}
function togglePlay(){if(playing){pause();return}playing=true;$('playBtn').textContent='Ⅱ Pause';lastTick=0;raf=requestAnimationFrame(tick);let v=$('previewFrame').querySelector('video');if(v)v.play().catch(()=>{})}
function split(){let c=clips.find(x=>x.id===selectedClip);if(!c||playhead<=c.start||playhead>=c.start+c.duration)return;let right={...c,id:uid(),start:playhead,sourceStart:c.sourceStart+(playhead-c.start),duration:c.start+c.duration-playhead};c.duration=playhead-c.start;clips.push(right);selectedClip=right.id;renderTimeline();renderInspector()}
async function saveProject(){projectName=$('projectName').value||'Untitled Project';await put({id:'project',kind:'project',name:projectName,clips,updated:Date.now()});setStatus('Saved · '+new Date().toLocaleTimeString())}
async function load(){await openDB();let records=await all();assets=records.filter(x=>x.kind==='asset');let p=records.find(x=>x.id==='project');if(p){projectName=p.name;clips=p.clips||[];$('projectName').value=projectName}renderAssets();renderTimeline();renderInspector();renderPreview()}
async function newProject(){if(!confirm('Create a new project? Save first if you want to keep the current timeline.'))return;clips=[];selectedClip=null;playhead=0;$('projectName').value='Untitled Project';renderTimeline();renderInspector();renderPreview();await saveProject()}
function exportWebM(){let canvas=document.createElement('canvas');canvas.width=1280;canvas.height=720;let ctx=canvas.getContext('2d'),stream=canvas.captureStream(30),rec=new MediaRecorder(stream,{mimeType:'video/webm'}),chunks=[];rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};rec.onstop=()=>{let blob=new Blob(chunks,{type:'video/webm'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=(projectName||'flux-project')+'.webm';a.click();URL.revokeObjectURL(url);setStatus('Export complete')};let start=performance.now(),end=duration();setStatus('Exporting preview…');rec.start();function draw(){let t=(performance.now()-start)/1000;ctx.fillStyle='#000';ctx.fillRect(0,0,canvas.width,canvas.height);let c=clipAt(t),asset=c&&assetBy(c.assetId);if(asset){let el=$('previewFrame').querySelector('video, img');if(el&&asset.type.startsWith('image/')){let r=el.naturalWidth/el.naturalHeight||16/9,w=canvas.width,h=w/r;if(h>canvas.height){h=canvas.height;w=h*r}ctx.drawImage(el,(canvas.width-w)/2,(canvas.height-h)/2,w,h)}else if(el&&asset.type.startsWith('video/')){let r=el.videoWidth/el.videoHeight||16/9,w=canvas.width,h=w/r;if(h>canvas.height){h=canvas.height;w=h*r}try{ctx.drawImage(el,(canvas.width-w)/2,(canvas.height-h)/2,w,h)}catch{}}}if(t>=end){rec.stop();return}requestAnimationFrame(draw)}renderPreview();let v=$('previewFrame').querySelector('video');if(v){v.muted=true;v.play().catch(()=>{})}draw()}
$('importBtn').onclick=()=>$('fileInput').click();$('fileInput').onchange=e=>importFiles([...e.target.files]);$('addClip').onclick=()=>{let a=assetBy(selectedAsset);if(a)addAsset(a)};$('newText').onclick=()=>{let blob=new Blob(['Add title text in your video editor'],{type:'text/plain'}),a={id:uid(),name:'Title card.txt',type:'text/plain',blob,size:blob.size,duration:5};assets.push(a);put({kind:'asset',...a});selectedAsset=a.id;renderAssets()};$('playBtn').onclick=togglePlay;$('toStart').onclick=()=>{pause();playhead=0;updatePlayhead();renderPreview()};$('stepBtn').onclick=()=>{pause();playhead+=1/30;updatePlayhead();renderPreview()};$('splitClip').onclick=split;$('deleteClip').onclick=()=>{clips=clips.filter(c=>c.id!==selectedClip);selectedClip=null;renderTimeline();renderInspector();renderPreview()};$('zoomIn').onclick=()=>{scale=Math.min(240,scale*1.25);renderTimeline()};$('zoomOut').onclick=()=>{scale=Math.max(20,scale/1.25);renderTimeline()};$('saveProject').onclick=saveProject;$('newProject').onclick=newProject;$('exportBtn').onclick=exportWebM;$('timelineScroll').addEventListener('click',e=>{if(e.target.closest('.clip'))return;let r=$('timelineScroll').getBoundingClientRect();playhead=Math.max(0,(e.clientX-r.left+$('timelineScroll').scrollLeft-90)/scale);pause();updatePlayhead();renderPreview()});$('projectName').onchange=()=>setStatus('Unsaved changes');load().catch(e=>{console.error(e);setStatus('Storage unavailable')});
})();
</script>
</body></html>
